services:
  ai-service:
    build: ./ai-service
    ports:
      - "8001:8000"
    # Mode développement : le service redémarre quand le code change
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./ai-service/app:/app/app
    environment:
      - WATCHFILES_FORCE_POLLING=true