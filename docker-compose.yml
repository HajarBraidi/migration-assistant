services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://api-gateway:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: ./api-gateway
      args:
        INSTALL_DEV: "true"
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api-gateway/app:/app/app
      - ./api-gateway/tests:/app/tests
    environment:
      - PROJECT_SERVICE_URL=http://project-service:8000
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ANALYSIS_SERVICE_URL=http://analysis-service:8000
      - COST_SERVICE_URL=http://cost-service:8000
      - JWT_SECRET=${JWT_SECRET}
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      - project-service
      - auth-service
      - analysis-service
      - cost-service

  cost-service:
    build:
      context: ./cost-service
      args:
        INSTALL_DEV: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./cost-service/app:/app/app
      - ./cost-service/tests:/app/tests
    environment:
      - WATCHFILES_FORCE_POLLING=true

  analysis-service:
    build:
      context: ./analysis-service
      args:
        INSTALL_DEV: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./analysis-service/app:/app/app
      - ./analysis-service/tests:/app/tests
    environment:
      - WATCHFILES_FORCE_POLLING=true

  auth-service:
    build:
      context: ./auth-service
      args:
        INSTALL_DEV: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./auth-service/app:/app/app
      - ./auth-service/tests:/app/tests
    environment:
      - DATABASE_URL=postgresql+psycopg://auth:auth@auth-db:5432/auth
      - JWT_SECRET=${JWT_SECRET}
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=auth
      - POSTGRES_PASSWORD=auth
      - POSTGRES_DB=auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
      args:
        INSTALL_DEV: "true"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./ai-service/app:/app/app
      - ./ai-service/tests:/app/tests
    environment:
      - WATCHFILES_FORCE_POLLING=true

  project-service:
    build:
      context: ./project-service
      args:
        INSTALL_DEV: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./project-service/app:/app/app
      - ./project-service/tests:/app/tests
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
      - DATABASE_URL=postgresql+psycopg://migration:migration@project-db:5432/projects
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      ai-service:
        condition: service_started
      project-db:
        condition: service_healthy

  project-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=migration
      - POSTGRES_PASSWORD=migration
      - POSTGRES_DB=projects
    volumes:
      - project-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d projects"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  project-db-data:
  auth-db-data:
